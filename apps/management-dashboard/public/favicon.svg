<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jagged horizontal brush stroke background -->
  <g fill="#CB0017" stroke="#CB0017">
    <!-- Solid core to prevent gaps -->
    <circle cx="50" cy="50" r="30" stroke-width="0" />
    
    <!-- Horizontal brush strokes to simulate the paint splash effect -->
    <line x1="24" y1="16" x2="75" y2="16" stroke-width="8" stroke-linecap="round" />
    <line x1="18" y1="24" x2="82" y2="24" stroke-width="12" stroke-linecap="round" />
    <line x1="12" y1="34" x2="88" y2="34" stroke-width="14" stroke-linecap="round" />
    <line x1="8"  y1="44" x2="93" y2="44" stroke-width="15" stroke-linecap="round" />
    <line x1="7"  y1="54" x2="94" y2="54" stroke-width="16" stroke-linecap="round" />
    <line x1="12" y1="64" x2="89" y2="64" stroke-width="14" stroke-linecap="round" />
    <line x1="16" y1="74" x2="84" y2="74" stroke-width="12" stroke-linecap="round" />
    <line x1="22" y1="84" x2="75" y2="84" stroke-width="10" stroke-linecap="round" />
    <line x1="30" y1="92" x2="65" y2="92" stroke-width="6" stroke-linecap="round" />
    <line x1="30" y1="8"  x2="65" y2="8"  stroke-width="6" stroke-linecap="round" />
    
    <!-- Extra stray brush dabs to make it look organic and jagged -->
    <line x1="10" y1="38" x2="20" y2="38" stroke-width="8" stroke-linecap="round" />
    <line x1="82" y1="48" x2="96" y2="48" stroke-width="8" stroke-linecap="round" />
    <line x1="9"  y1="60" x2="25" y2="60" stroke-width="8" stroke-linecap="round" />
    <line x1="80" y1="28" x2="89" y2="28" stroke-width="8" stroke-linecap="round" />
    <line x1="15" y1="80" x2="25" y2="80" stroke-width="6" stroke-linecap="round" />
    <line x1="75" y1="82" x2="85" y2="82" stroke-width="6" stroke-linecap="round" />
    <line x1="14" y1="28" x2="22" y2="28" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- White 'C' with yellow outline -->
  <text 
    x="50" 
    y="76" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="80" 
    font-weight="900" 
    fill="#ffffff" 
    stroke="#ffc107" 
    stroke-width="5" 
    text-anchor="middle"
  >C</text>
</svg>