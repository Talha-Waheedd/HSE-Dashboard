<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><title>Verify Your Email</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: #059669; padding: 32px; text-align: center; }
    .header h1 { color: #fff; margin: 0; font-size: 22px; }
    .body { padding: 32px; color: #374151; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 20px; padding: 14px 28px; background: #059669; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .footer { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>✅ Verify Your Email</h1></div>
    <div class="body">
      <p>Hi <strong>{{name}}</strong>,</p>
      <p>Click the button below to verify your email and activate your account.</p>
      <a href="{{verificationUrl}}" class="btn">Verify Email Address</a>
      <p style="margin-top:24px; font-size:13px; color:#6b7280;">Link expires in 24 hours.</p>
    </div>
    <div class="footer">© {{year}} {{appName}}. All rights reserved.</div>
  </div>
</body>
</html>
