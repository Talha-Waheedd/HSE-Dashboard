<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to {{appName}}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .header { background: #4f46e5; padding: 32px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
    .body { padding: 32px; color: #374151; }
    .body p { line-height: 1.6; }
    .btn { display: inline-block; margin-top: 20px; padding: 14px 28px; background: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .footer { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Welcome to {{appName}}! 🎉</h1></div>
    <div class="body">
      <p>Hi <strong>{{name}}</strong>,</p>
      <p>Thanks for signing up! Please verify your email address to get started.</p>
      <a href="{{verificationUrl}}" class="btn">Verify Email Address</a>
      <p style="margin-top:24px; font-size:13px; color:#6b7280;">
        This link expires in 24 hours. If you didn't create an account, you can safely ignore this email.
      </p>
    </div>
    <div class="footer">© {{year}} {{appName}}. All rights reserved.</div>
  </div>
</body>
</html>
